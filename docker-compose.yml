services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carelens-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped

  frontend:
    build:
      context: ./carelens-frontend
      dockerfile: Dockerfile
    container_name: carelens-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./carelens-frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    restart: unless-stopped